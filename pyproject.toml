[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "difficulty-aware-llm-routing"
version = "0.1.0"
description = "Difficulty-aware selection of large language models under quality and cost constraints"
readme = "README.md"
license = "MIT"
authors = [{ name = "Oleksandr Kholodniak" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "torch>=2.2",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/darouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["darouter"]
